  - id: "CommandArgument"
    name: "CommandArgument"
    type: "Type"
    description: "Указывает, что параметр метода должен быть извлечен из текста ко\
      манды.\n\n\n\nNyagram автоматически парсит текст сообщения, разбивает его на\
      \ токены (по пробелам,\nучитывая кавычки) и маппит их на аннотированные пара\
      метры.\n\n\n### Поддерживаемые типы:\n\n\n    \n- String (одно слово или \"ф\
      раза в кавычках\")\n    \n- Integer, Long, Double, Float\n    \n- Boolean (true/false,\
      \ yes/no, 1/0, +/-)\n    \n- Enum константы"
