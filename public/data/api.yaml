  - id: "ChatMember"
    name: "ChatMember"
    type: "Interface"
    description: "Базовый интерфейс, представляющий участника чата и его статус.\n\
      \n\n\nВ зависимости от статуса (status), этот объект будет десериализован в\
      \ один из следующих классов:\n\n    \n- `ChatMemberOwner` - создатель (creator)\n\
      \    \n- `ChatMemberAdministrator` - администратор (administrator)\n    \n-\
      \ `ChatMemberMember` - обычный участник (member)\n    \n- `ChatMemberRestricted`\
      \ - ограниченный участник (restricted)\n    \n- `ChatMemberLeft` - покинувши\
      й чат (left)\n    \n- `ChatMemberBanned` - забаненный (kicked)"
