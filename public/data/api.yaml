    example: "Сообщение: <code>/gift @user 100</code>\n\npublic void gift(\n    CommandContext\
      \ ctx, \n    @CommandArgument(\"target\") String target, // \"@user\"\n    @CommandArgument(\"\
      amount\") int amount     // 100\n)"
    typeParameters: []
  - id: "BotCommand"
    name: "BotCommand"
    type: "Type"
    description: "Помечает класс как обработчик команд Telegram (Command Handler).\n\
      \n\n\nЭта аннотация регистрирует класс как Spring Bean и указывает Nyagram\n\
      сканировать его на наличие методов, помеченных `CommandHandler`.\n\n\n## Реж\
      имы использования:\n\n\n    \n- \n        **Режим контроллера (пустое значен\
      ие):** Класс действует как контейнер для множества разных команд.\n        К\
      аждый метод внутри определяет свой собственный путь команды.\n        \n```java\n\
      \n        `@BotCommand`\n        public class MyController {\n            `@CommandHandler(\"\
      /start\")`\n            public void start(...) {}\n        }\n        \n```\n\
      \n    \n    \n- \n        **Режим одной команды (значение задано):** Класс п\
      редставляет одну корневую команду.\n        Методы могут определять подкоман\
      ды или быть обработчиком по умолчанию.\n        \n```java\n\n        `@BotCommand(\"\
      /settings\")`\n        public class SettingsCommand {\n            `@CommandHandler`\
